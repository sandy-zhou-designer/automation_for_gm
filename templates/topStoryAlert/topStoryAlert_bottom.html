<table
  class="mobile_full"
  id="top-stories"
  width="600"
  align="center"
  style="
    table-layout: fixed;
    vertical-align: top;
    border-spacing: 0;
    border-collapse: collapse;
    mso-table-lspace: 0;
    mso-table-rspace: 0;
    background-color: #fff;
    font-family: Inter, Arial, Sans-serif;
  "
  cellpadding="0"
  cellspacing="0"
  role="presentation"
  valign="top"
  data-section="top-article-section"
>
  <tbody>
    <tr>
      <td
        align="center"
        style="padding-left: 10px; padding-right: 10px; box-sizing: border-box"
      >
        <table
          class="mobile_full"
          role="presentation"
          style="
            border-collapse: collapse;
            border-spacing: 0;
            text-align: left;
            min-width: 320px;
            max-width: 600px;
            overflow-wrap: break-word;
            word-wrap: break-word;
            word-break: break-word;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
          "
        >
          <tbody>
            <tr class="mobileWhite section">
              <td
                class="mobile_full mobileWhite"
                align="left"
                style="text-align: left; background-color: #fff"
              >
                <table
                  class="mobile_full"
                  style="
                    border-collapse: collapse;
                    border-spacing: 0;
                    text-align: left;
                    min-width: 320px;
                    overflow-wrap: break-word;
                    word-wrap: break-word;
                    word-break: break-word;
                    margin: 0 auto;
                    max-width: 600px;
                    width: 100%;
                  "
                >
                  <tr>
                    <td class="mobile_full" align="center">
                      <div style="padding: 0 0 12px">
                        <a
                          href="{{topStoryAlert-bottom-image-link}}?utm_source=topAlertStory_{{userStatus}}&utm_campaign={{trackingName}}{{date}}-ca&utm_medium=email&est=[EMAIL_SECURE_LINK]&utm_content=topStoryAlert-bottom-image"
                          target="_blank"
                          style="outline: 0"
                          tabindex="-1"
                          width="300"
                          ><img
                            src="{{topStoryAlert-bottom-image-url}}"
                            style="width: 100%; padding-top: 8px"
                        /></a>
                      </div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </tbody>
        </table>
      </td>
    </tr>
  </tbody>
</table>
