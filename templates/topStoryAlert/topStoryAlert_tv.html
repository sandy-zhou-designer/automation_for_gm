<table
  class="mobile_full"
  id="top-stories"
  width="600"
  align="center"
  style="
    table-layout: fixed;
    vertical-align: top;
    border-spacing: 0;
    border-collapse: collapse;
    mso-table-lspace: 0;
    mso-table-rspace: 0;
    background-color: #fff;
    font-family: Inter, Arial, Sans-serif;
  "
  cellpadding="0"
  cellspacing="0"
  role="presentation"
  valign="top"
  data-section="top-article-section"
>
  <tbody>
    <tr>
      <td
        align="center"
        style="
          padding-left: 10px;
          padding-right: 10px;
          padding-top: 0px;
          box-sizing: border-box;
        "
      >
        <table
          class="mobile_full"
          role="presentation"
          style="
            border-collapse: collapse;
            border-spacing: 0;
            text-align: left;
            min-width: 320px;
            max-width: 600px;
            overflow-wrap: break-word;
            word-wrap: break-word;
            word-break: break-word;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
          "
        >
          <tbody>
            <tr class="mobileWhite section">
              <td
                class="mobile_full mobileWhite"
                align="left"
                style="text-align: left; background-color: #fff"
              >
                <table>
                  <tr>
                    <td
                      align="left"
                      style="
                        color: #000;
                        font-size: 18px;
                        font-weight: 700;
                        line-height: 19.8px;
                        letter-spacing: -3%;
                        border-top: 0.3px solid #000000;
                        padding-top: 5px;
                        font-family: Georgia;
                      "
                    >
                    <img
                    class="logo transparent-image"
                    src="https://img.theepochtimes.ca/img/logos/epochtv-logo.svg"
                    alt="The Epoch Times TV" width="165" style="
                        max-width: 165px;
                        height: auto;
                        width: 100%;
                      " />
                    </td>
                  </tr>
                  <tr>
                    <td style="padding: 30px 10px 20px">
                      <a
                        style="text-decoration: none; color: #000"
                        href="{{article-link}}?{{utm}}&utm_campaign={{trackingName}}{{date}}-ca&utm_medium=email&est=[EMAIL_SECURE_LINK]&utm_content={{alt}}"
                        target="_blank"
                      >
                        <div
                          style="
                            font-family: Georgia;
                            font-size: 28px;
                            font-style: normal;
                            font-weight: 700;
                            line-height: 36.4px;
                            margin-top: 0;
                            margin-bottom: 0px;
                            mso-line-height-alt: 1.4;
                            text-align: center;
                          "
                          class="mb_fz22"
                        >
                          {{article-title}}
                        </div>
                      </a>
                    </td>
                  </tr>
                  <tr>
                    <td class="mobile_full" align="center">
                      <div style="padding: 0 0 12px">
                        <a
                          href="{{article-link}}?{{utm}}&utm_campaign={{trackingName}}{{date}}-ca&utm_medium=email&est=[EMAIL_SECURE_LINK]&utm_content={{alt}}"
                          target="_blank"
                          width="300"
                          ><img
                            src="{{article-img}}"
                            style="width: 100%; padding-top: 8px"
                        /></a>
                      </div>
                    </td>
                  </tr>
                
                  <tr>
                    <td style="padding: 12px 22px 45px; text-align: right">

                        target="_blank"
                        style="
                          box-sizing: border-box;
                          display: inline-block;
                          text-decoration: none;
                          -webkit-text-size-adjust: none;

                          background-color: #ffffff;
                          border-radius: 5px;

                          mso-border-alt: none;
                        "
                        ><span style="
                        display: block;
                        padding: 8px 15px;                          
                        font-size: 13px;
                          font-style: normal;
                          font-weight: 700;
                          line-height: 16.25px;">Share</span></a
                      >
                      <!--[if mso]></center></v:roundrect>&nbsp;&nbsp;&nbsp;&nbsp;<![endif]-->
                      <!--[if mso]><v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{article-link}}?{{utm}}&utm_campaign={{trackingName}}{{date}}-ca&utm_medium=email&est=[EMAIL_SECURE_LINK]&utm_content={{alt}}" style="height:38px; v-text-anchor:middle; width:155px;" arcsize="14.295%" stroke="f" fillcolor="#BA0000"><w:anchorlock/><center style="color:#FFFFFF;"><![endif]-->
                        <a
                        href="{{article-link}}?{{utm}}&utm_campaign={{trackingName}}{{date}}-ca&utm_medium=email&est=[EMAIL_SECURE_LINK]&utm_content={{alt}}"
                        target="_blank"
                        style="
                          box-sizing: border-box;
                          display: inline-block;
                          text-decoration: none;
                          -webkit-text-size-adjust: none;
                          text-align: center;
                          color: #FFFFFF;
                          background-color: #BA0000;
                          border-radius: 5px;
                          -webkit-border-radius: 5px;
                          -moz-border-radius: 5px;
                          width: auto;
                          max-width: 100%;
                          word-break: break-word;
                          word-wrap: break-word;
                          color: #fff;
                          text-decoration: none;
                        "
                        ><span style="
                        display: block;
                        padding: 11px 15px;                          
                        font-size: 13px;
                        font-style: normal;
                        font-weight: 700;
                        line-height: 16.25px;">Continue To Video</span></a
                      >
                      <!--[if mso]></center></v:roundrect><![endif]-->
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </tbody>
        </table>
      </td>
    </tr>
  </tbody>
</table>
