<table class="article_block mobile_full" style="
                                border-collapse: collapse;
                                border-spacing: 0;
                                text-align: left;
                                min-width: 220px;
                                overflow-wrap: break-word;
                                word-wrap: break-word;
                                word-break: break-word;
                                margin: 0 auto;
                                max-width: 280px;
                                width: 100%;
                              ">
  <tbody>
    <tr>
      <td class="article_image mobile_full" style="text-align: center">
        <div>
          <a style="
                                          text-decoration: none;
                                          color: #000;
                                        "
            href="{{article-link}}?{{utm}}&utm_campaign={{trackingName}}{{date}}-ca&utm_medium=email&est=[EMAIL_SECURE_LINK]&utm_content={{alt}}"
            target="_blank"><img src="{{article-img}}" class="mobile_full" width="260" style="
                                            width: 260px;
                                            max-width: 100%;
                                            height: auto;
                                          " /></a>
        </div>
      </td>
    </tr>
    <tr>
      <td class="article_title mobile_full mobile_pt10" style="
                                      padding: 10px;
                                      text-align: center;
                                      font-family: Georgia;
                                      font-size: 14px;
                                      line-height: 20px;
                                    ">
        <a style="text-decoration: none; color: #000"
          href="{{article-link}}?{{utm}}&utm_campaign={{trackingName}}{{date}}-ca&utm_medium=email&est=[EMAIL_SECURE_LINK]&utm_content={{alt}}"
          target="_blank">{{article-title}}</a>
      </td>
    </tr>
    <tr>
      <td class="article_url  mobile_pt10" style="text-align: center; padding-top: {{ff_pt}}px;">
        <!--[if mso]><v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{article-link}}?{{utm}}&utm_campaign={{trackingName}}{{date}}-ca&utm_medium=email&est=[EMAIL_SECURE_LINK]&utm_content={{alt}}" style="height:34px; v-text-anchor:middle; width:110px;" arcsize="14.706%" strokeweight="1px" strokecolor="#000000" fillcolor="#ffffff"><w:anchorlock/><center style="color:#000000;"><![endif]--><a
          href="{{article-link}}?{{utm}}&utm_campaign={{trackingName}}{{date}}-ca&utm_medium=email&est=[EMAIL_SECURE_LINK]&utm_content={{alt}}" target="_blank" class="v-button"
          style="box-sizing: border-box;display: inline-block;text-decoration: none;-webkit-text-size-adjust: none;text-align: center;color: #000; background-color: #fff; border: 1px solid #000; border-radius: 5px;-webkit-border-radius: 5px; -moz-border-radius: 5px; width:auto; max-width:100%; overflow-wrap: break-word; word-break: break-word; word-wrap:break-word; mso-border-alt: none;font-size: 14px; line-height: 15px; font-family: Inter, Helvetica, Arial, sans-serif;"
          class="mobile_full mobile_block"
          class="mobile_plr16"><span
              style="display:block;padding:10px 11px;font-size:13px; line-height: 14px; font-weight:bold; font-family:  Helvetica, Inter,Arial, sans-serif;">
              READ NOW
          </span></a>
      <!--[if mso]></center></v:roundrect><![endif]-->
      </td>
    </tr>
  </tbody>
</table>
