<table
  class="mobile_full"
  id="top-stories"
  width="600"
  align="center"
  style="
    table-layout: fixed;
    vertical-align: top;
    border-spacing: 0;
    border-collapse: collapse;
    mso-table-lspace: 0;
    mso-table-rspace: 0;
    background-color: #fff;
    font-family: Inter, Arial, Sans-serif;
  "
  cellpadding="0"
  cellspacing="0"
  role="presentation"
  valign="top"
  data-section="top-article-section"
>
  <tbody>
    <tr>
      <td
        align="center"
        style="
          padding-left: 10px;
          padding-right: 10px;
          padding-top: 0px;
          box-sizing: border-box;
        "
      >
        <table
          class="mobile_full"
          role="presentation"
          style="
            border-collapse: collapse;
            border-spacing: 0;
            text-align: left;
            min-width: 320px;
            max-width: 600px;
            overflow-wrap: break-word;
            word-wrap: break-word;
            word-break: break-word;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
          "
        >
          <tbody>
            <tr class="mobileWhite section">
              <td
                class="mobile_full mobileWhite"
                align="left"
                style="text-align: left; background-color: #fff"
              >
                <table>
                  <tr>
                    <td align="left" style="color: #0068a5">
                      {{categories}}
                    </td>
                  </tr>
                  <tr>
                    <td style="padding-top: 10px">
                      <a
                        style="text-decoration: none; color: #000"
                        href="{{article-link}}?{{utm}}&utm_campaign={{trackingName}}{{date}}-ca&utm_medium=email&est=[EMAIL_SECURE_LINK]&utm_content={{alt}}"
                        target="_blank"
                      >
                        <div
                          style="
                            font-family: Georgia;
                            font-size: 22px;
                            font-style: normal;
                            font-weight: 700;
                            line-height: 1.3;
                            letter-spacing: -0.2px;
                            margin-top: 0;
                            margin-bottom: 0px;
                            mso-line-height-alt: 1.4;
                          "
                          class="mb_fz22"
                        >
                          {{article-title}}
                        </div>
                      </a>
                    </td>
                  </tr>
                  <tr>
                    <td class="mobile_full" align="center">
                      <div style="padding: 0 0 12px">
                        <a
                          href="{{article-link}}?{{utm}}&utm_campaign={{trackingName}}{{date}}-ca&utm_medium=email&est=[EMAIL_SECURE_LINK]&utm_content={{alt}}"
                          target="_blank"
                          width="300"
                          ><img
                            src="{{article-img}}"
                            style="width: 100%; padding-top: 8px"
                        /></a>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td class="mobile_full" align="left">
                      {{first_three_p}}
                    </td>
                  </tr>
                  <tr>
                    <td
                      style="
                        padding-top: 0px;
                        text-align: left;
                        color: #bfb9a7;
                        font-size: 16px;
                        line-height: 28px;
                        font-weight: 400;
                      "
                    >
                      - From {{article-author}}, an Epoch Times
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </tbody>
        </table>
      </td>
    </tr>
  </tbody>
</table>
